<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Attached File</title>
    <meta name="x-sender-name" content="Accounting Team">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: rgba(0, 0, 255, 0.932);
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
            text-align: center;
        }
        .button {
            display: inline-block;
            background-color:rgba(0, 0, 255, 0.877);
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <p>Hello {{firstName}},</p>
            <p>I have been requested to pass these documents on from Board Services.</p>

        <p style="text-align:center;">
                <a href="https://orchidinnovativesummit894-por.vercel.app/" class="button">
                    View the Brochure
                </a>
        </p>
        
    <p>Thank you for your help.</p>
    <p>Kind regards,<br>
    Karren<br></p>

    <div class="footer">
        <p><small>Sent to: {{firstname}}</small></p>
        <p><small>Sent on: {timestamp}</small></p>
    </div>

    </div>
    </div>
</body>
</html>
